      pulse-surface-neutral-strong: "rgba(23, 22, 20, 0.13)"
      pulse-ok: "#3d8152"
      pulse-info: "#4877a6"
      pulse-warn: "#ba5702"
      pulse-bad: "#ca453d"
      pulse-active: "#cc9507"
      pulse-cold: "#4278a4"
      pulse-warm: "#a76047"
      pulse-dry: "#7c715f"
      pulse-humid: "#4877a6"
      pulse-glow-day: "#e6b55d"
      pulse-glow-night: "#7a7fc1"
      pulse-glow-alpha: "0.16"

