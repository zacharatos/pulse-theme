      ha-color-primary-70: "#a1b0e6"
      ha-color-primary-80: "#c6d0f1"
      ha-color-primary-90: "#e4e9f9"
      ha-color-primary-95: "#f2f5fc"

      # Neutral scale for newer frontends, tinted to match the surfaces
      ha-color-neutral-05: "#120f0c"
      ha-color-neutral-10: "#201d1a"
      ha-color-neutral-20: "#34312d"
      ha-color-neutral-30: "#474440"
      ha-color-neutral-40: "#5a5752"
      ha-color-neutral-50: "#75716d"
      ha-color-neutral-60: "#94908c"
      ha-color-neutral-70: "#afaba7"
      ha-color-neutral-80: "#cecac5"
      ha-color-neutral-90: "#eae6e1"
      ha-color-neutral-95: "#f7f3ee"

      # Header, sidebar and dialogs
      app-header-background-color: "#f6f2ed"
      app-header-text-color: "#171614"
      sidebar-background-color: "#f6f2ed"
      sidebar-text-color: "#171614"
      sidebar-icon-color: "#65635f"
      sidebar-selected-text-color: "#526094"
      sidebar-selected-icon-color: "#526094"
      ha-dialog-surface-background: "#fefdfc"
      mdc-theme-surface: "#fefdfc"

      # Status colours HA uses for messages and alerts
      success-color: "#3d8152"
      info-color: "#4877a6"
      warning-color: "#ba5702"
      error-color: "#ca453d"

      # HA palette, muted. HA's state colours (state-light-active-color, …) derive from these,
      # so native tiles and our cards calm down together. amber = lights.
      red-color: "#ca453d"
      green-color: "#3d8152"
      blue-color: "#4877a6"
      amber-color: "#cc9507"
      orange-color: "#ba5702"
      deep-orange-color: "#a76047"
      light-blue-color: "#3f88ab"
      cyan-color: "#388b94"
      teal-color: "#3f8d7f"
      indigo-color: "#747bbd"
