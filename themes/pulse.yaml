      # State colours where HA's default mapping isn't what Pulse means (open doors and windows are
      # "needs a look", not amber like a light that is on)
      state-binary_sensor-door-on-color: "#ba5702"
      state-binary_sensor-garage_door-on-color: "#ba5702"
      state-binary_sensor-opening-on-color: "#ba5702"
      state-binary_sensor-window-on-color: "#ba5702"
