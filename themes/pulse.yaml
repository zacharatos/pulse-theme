# Pulse — a calm theme family for Home Assistant: Pulse (Stone), Pulse Glass and Pulse Tonal.
# GENERATED by scripts/build-theme.mjs from scripts/palette.mjs. Don't edit by hand: change the palette and re-run.
# Colours meet WCAG AA in both modes (npm run contrast), except lights in light mode (bright gold, see README).

Pulse:
  # Shape: 16px cards, 12px controls
  ha-card-border-radius: "16px"
  ha-card-features-border-radius: "12px"

  # Type: the device's own system font, nothing to download
  ha-font-family-body: "-apple-system, BlinkMacSystemFont, \"SF Pro Text\", \"Segoe UI Variable Text\", \"Segoe UI\", Roboto, Noto, sans-serif"

  # Pulse tokens: shape and rhythm (read by our cards; see README)
  pulse-radius: "16px"
  pulse-control-radius: "12px"
  pulse-chip-height: "30px"
  pulse-gap: "12px"
  pulse-pad: "12px"
  pulse-row-height: "56px"
  pulse-motion-fast: "150ms"
  pulse-motion-normal: "250ms"
  pulse-motion-slow: "350ms"
  pulse-ease: "cubic-bezier(0.2, 0, 0, 1)"

  modes:
    light:
      # Card edge and depth
      ha-card-border-width: "1px"
      ha-card-box-shadow: "0 1px 2px rgba(40, 30, 20, 0.05), 0 4px 16px -4px rgba(40, 30, 20, 0.07)"

      # Surfaces and text
      primary-background-color: "#f1ede7"
      secondary-background-color: "#e8e4de"
      card-background-color: "#fefefe"
      ha-card-border-color: "rgba(40, 36, 30, 0.07)"
      ha-section-background-color: "#e8e4de"
      lovelace-background: "#f1ede7"
      divider-color: "rgba(40, 36, 30, 0.07)"
      outline-color: "rgba(40, 36, 30, 0.07)"
      primary-text-color: "#171613"
      secondary-text-color: "#66635f"
      disabled-text-color: "#a8a49e"
      state-icon-color: "#66635f"
      state-inactive-color: "#66635f"

      # Accent: one colour for selection, links, buttons and switches
      primary-color: "#526094"
      accent-color: "#526094"
      dark-primary-color: "#58659a"
      light-primary-color: "#c6d0f1"
      text-primary-color: "#ffffff"
      text-accent-color: "#ffffff"

      # Accent scale for newer frontends (2026+): buttons, switches, checkboxes read these, not primary-color.
      # Internal HA tokens: check on every HA release. Ignored by older frontends.
      ha-color-primary-05: "#090e21"
      ha-color-primary-10: "#141a37"
      ha-color-primary-20: "#212a52"
      ha-color-primary-30: "#3d497b"
      ha-color-primary-40: "#58659a"
      ha-color-primary-50: "#6977ad"
      ha-color-primary-60: "#8695cd"
      ha-color-primary-70: "#a1b0e6"
      ha-color-primary-80: "#c6d0f1"
      ha-color-primary-90: "#e4e9f9"
      ha-color-primary-95: "#f2f5fc"

      # Neutral scale for newer frontends, tinted to match the surfaces
      ha-color-neutral-05: "#120f0b"
      ha-color-neutral-10: "#201d19"
      ha-color-neutral-20: "#34312d"
      ha-color-neutral-30: "#47443f"
      ha-color-neutral-40: "#5a5752"
      ha-color-neutral-50: "#75716c"
      ha-color-neutral-60: "#94908b"
      ha-color-neutral-70: "#afaba6"
      ha-color-neutral-80: "#cecac4"
      ha-color-neutral-90: "#ebe6e1"
      ha-color-neutral-95: "#f8f3ee"

      # Header, sidebar and dialogs
      app-header-background-color: "#f1ede7"
      app-header-text-color: "#171613"
      sidebar-background-color: "#f1ede7"
      sidebar-text-color: "#171613"
      sidebar-icon-color: "#66635f"
      sidebar-selected-text-color: "#526094"
      sidebar-selected-icon-color: "#526094"
      ha-dialog-surface-background: "#fefefe"
      mdc-theme-surface: "#fefefe"

      # Switches (HA's ha-switch, and the Pulse cards that draw their own): on in the accent; off a grey thumb on
      # a faint track (HA draws the track at 38%), so the off state reads on every surface, frosted white included
      switch-checked-color: "#526094"
      switch-unchecked-button-color: "#66635f"
      switch-unchecked-track-color: "#66635f"

      # Status colours HA uses for messages and alerts
      success-color: "#3d8152"
      info-color: "#4877a6"
      warning-color: "#ba5702"
      error-color: "#cb473f"

      # HA palette, muted. HA's state colours (state-light-active-color, …) derive from these,
      # so native tiles and our cards calm down together. amber = lights.
      red-color: "#cb473f"
      green-color: "#3d8152"
      blue-color: "#4877a6"
      amber-color: "#cc9507"
      orange-color: "#ba5702"
      deep-orange-color: "#a76047"
      light-blue-color: "#4189ad"
      cyan-color: "#3a8c95"
      teal-color: "#418e80"
      indigo-color: "#757dbf"
      purple-color: "#9b72ae"
      pink-color: "#bd658a"
      deep-purple-color: "#8877b9"
      light-green-color: "#648c4e"
      lime-color: "#7b8935"
      yellow-color: "#948000"
      brown-color: "#a07a61"

      # State colours where HA's default mapping isn't what Pulse means (open doors and windows are
      # "needs a look", not amber like a light that is on; an automation that is on, or a script that is
      # running, is the house's own logic at work: the accent, not a light's gold)
      state-automation-on-color: "#526094"
      state-script-on-color: "#526094"
      state-binary_sensor-door-on-color: "#ba5702"
      state-binary_sensor-garage_door-on-color: "#ba5702"
      state-binary_sensor-opening-on-color: "#ba5702"
      state-binary_sensor-window-on-color: "#ba5702"
      state-cover-active-color: "#9b72ae"
      state-climate-cool-color: "#4278a4"
      state-climate-heat-color: "#a76047"
      state-humidifier-on-color: "#4877a6"
      state-sun-above_horizon-color: "#eace8c"
      state-sun-below_horizon-color: "#7a7fc1"

      # Pulse tokens: colour (read by our cards; HA also derives --rgb-pulse-* from each hex)
      pulse-accent: "#526094"
      pulse-on-accent: "#ffffff"
      pulse-surface-neutral: "rgba(23, 22, 19, 0.065)"
      pulse-surface-neutral-hover: "rgba(23, 22, 19, 0.105)"
      pulse-surface-neutral-strong: "rgba(23, 22, 19, 0.145)"
      pulse-ok: "#3d8152"
      pulse-info: "#4877a6"
      pulse-warn: "#ba5702"
      pulse-bad: "#cb473f"
      pulse-active: "#cc9507"
      pulse-cold: "#4278a4"
      pulse-warm: "#a76047"
      pulse-dry: "#7e7361"
      pulse-humid: "#4877a6"
      pulse-glow-day: "#eace8c"
      pulse-glow-night: "#7a7fc1"
      pulse-glow-alpha: "0.1"

    dark:
      # Card edge and depth
      ha-card-border-width: "1px"
      ha-card-box-shadow: "inset 0 1px 0 rgba(255, 244, 228, 0.06), 0 1px 2px rgba(0, 0, 0, 0.35), 0 10px 28px -12px rgba(0, 0, 0, 0.6)"

