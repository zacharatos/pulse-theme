Pulse Tonal:
  # Shape: 24px cards, 16px controls
  ha-card-border-radius: "24px"
  ha-card-features-border-radius: "16px"
  ha-tile-icon-border-radius: "14px"

  # Type: a rounded system font where the device has one (Apple), else the system font; nothing to download
  ha-font-family-body: "\"SF Pro Rounded\", ui-rounded, -apple-system, BlinkMacSystemFont, \"SF Pro Text\", \"Segoe UI Variable Text\", \"Segoe UI\", Roboto, Noto, sans-serif"

  # Pulse tokens: shape and rhythm (read by our cards; see README)
  pulse-radius: "24px"
  pulse-control-radius: "16px"
  pulse-chip-height: "30px"
  pulse-gap: "12px"
  pulse-pad: "12px"
  pulse-row-height: "56px"
  pulse-motion-fast: "150ms"
  pulse-motion-normal: "250ms"
  pulse-motion-slow: "350ms"
  pulse-ease: "cubic-bezier(0.2, 0, 0, 1)"

  modes:
    light:
      # Card edge and depth
      ha-card-border-width: "0px"
      ha-card-box-shadow: "none"

      # Surfaces and text
      primary-background-color: "#fef8fb"
      secondary-background-color: "#feecf5"
      card-background-color: "#fce2f0"
      ha-card-border-color: "rgba(60, 30, 45, 0.07)"
      ha-section-background-color: "#feecf5"
      lovelace-background: "#fef8fb"
      divider-color: "rgba(60, 30, 45, 0.07)"
      outline-color: "rgba(60, 30, 45, 0.07)"
      primary-text-color: "#1b1417"
      secondary-text-color: "#6b5f65"
      disabled-text-color: "#af9fa8"
      state-icon-color: "#6b5f65"
      state-inactive-color: "#6b5f65"

      # Accent: one colour for selection, links, buttons and switches
      primary-color: "#8b4a70"
      accent-color: "#8b4a70"
      dark-primary-color: "#915076"
      light-primary-color: "#edc3d9"
      text-primary-color: "#ffffff"
      text-accent-color: "#ffffff"

      # Accent scale for newer frontends (2026+): buttons, switches, checkboxes read these, not primary-color.
      # Internal HA tokens: check on every HA release. Ignored by older frontends.
      ha-color-primary-05: "#1d0614"
      ha-color-primary-10: "#310e24"
      ha-color-primary-20: "#4a1837"
      ha-color-primary-30: "#723459"
