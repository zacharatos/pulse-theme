# Pulse — a calm theme family for Home Assistant: Pulse (Stone), Pulse Glass and Pulse Tonal.
# GENERATED by scripts/build-theme.mjs from scripts/palette.mjs. Don't edit by hand: change the palette and re-run.
# Colours meet WCAG AA in both modes (npm run contrast), except lights in light mode (bright gold, see README).

Pulse:
  # Shape: 16px cards, family control radius
  ha-card-border-radius: "16px"
  ha-card-border-width: "1px"
  ha-card-box-shadow: "none"
  ha-card-features-border-radius: "12px"

  # Type: the device's own system font, nothing to download
  ha-font-family-body: "-apple-system, BlinkMacSystemFont, \"SF Pro Text\", \"Segoe UI Variable Text\", \"Segoe UI\", Roboto, Noto, sans-serif"

  # Pulse tokens: shape and rhythm (read by our cards; see README)
  pulse-radius: "16px"
  pulse-control-radius: "12px"
  pulse-chip-height: "30px"
  pulse-gap: "12px"
  pulse-pad: "12px"
  pulse-row-height: "56px"
  pulse-motion-fast: "150ms"
  pulse-motion-normal: "250ms"
  pulse-motion-slow: "350ms"
  pulse-ease: "cubic-bezier(0.2, 0, 0, 1)"

  modes:
    light:
      # Surfaces and text
      primary-background-color: "#f6f2ed"
      secondary-background-color: "#ebe7e2"
      card-background-color: "#fefdfc"
      ha-card-border-color: "rgba(40, 36, 30, 0.09)"
      ha-section-background-color: "#ebe7e2"
      lovelace-background: "#f6f2ed"
      divider-color: "rgba(40, 36, 30, 0.09)"
      outline-color: "rgba(40, 36, 30, 0.09)"
      primary-text-color: "#171614"
      secondary-text-color: "#65635f"
      disabled-text-color: "#a8a49f"
      state-icon-color: "#65635f"
      state-inactive-color: "#65635f"

      # Accent: one colour for selection, links, buttons and switches
      primary-color: "#526094"
      accent-color: "#526094"
      dark-primary-color: "#58659a"
      light-primary-color: "#c6d0f1"
      text-primary-color: "#ffffff"
      text-accent-color: "#ffffff"

      # Accent scale for newer frontends (2026+): buttons, switches, checkboxes read these, not primary-color.
      # Internal HA tokens: check on every HA release. Ignored by older frontends.
      ha-color-primary-05: "#090e21"
      ha-color-primary-10: "#141a37"
      ha-color-primary-20: "#212a52"
      ha-color-primary-30: "#3d497b"
      ha-color-primary-40: "#58659a"
      ha-color-primary-50: "#6977ad"
