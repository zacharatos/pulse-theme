Pulse Tonal:
  # Shape: 16px cards, family control radius
  ha-card-border-radius: "16px"
  ha-card-border-width: "0px"
  ha-card-box-shadow: "0 1px 2px rgba(0, 0, 0, 0.06)"
  ha-card-features-border-radius: "14px"
  ha-tile-icon-border-radius: "12px"

  # Type: the device's own system font, nothing to download
  ha-font-family-body: "-apple-system, BlinkMacSystemFont, \"SF Pro Text\", \"Segoe UI Variable Text\", \"Segoe UI\", Roboto, Noto, sans-serif"

  # Pulse tokens: shape and rhythm (read by our cards; see README)
  pulse-radius: "16px"
  pulse-control-radius: "14px"
  pulse-chip-height: "30px"
  pulse-gap: "12px"
  pulse-pad: "12px"
  pulse-row-height: "56px"
  pulse-motion-fast: "150ms"
  pulse-motion-normal: "250ms"
  pulse-motion-slow: "350ms"
  pulse-ease: "cubic-bezier(0.2, 0, 0, 1)"

  modes:
    light:
      # Surfaces and text
      primary-background-color: "#faf0f5"
      secondary-background-color: "#f0e6eb"
      card-background-color: "#fffafc"
      ha-card-border-color: "rgba(60, 30, 45, 0.07)"
      ha-section-background-color: "#f0e6eb"
      lovelace-background: "#faf0f5"
      divider-color: "rgba(60, 30, 45, 0.07)"
      outline-color: "rgba(60, 30, 45, 0.07)"
      primary-text-color: "#191517"
      secondary-text-color: "#686164"
      disabled-text-color: "#aaa2a6"
      state-icon-color: "#686164"
      state-inactive-color: "#686164"

      # Accent: one colour for selection, links, buttons and switches
      primary-color: "#8b4a70"
      accent-color: "#8b4a70"
      dark-primary-color: "#915076"
      light-primary-color: "#edc3d9"
      text-primary-color: "#ffffff"
      text-accent-color: "#ffffff"

      # Accent scale for newer frontends (2026+): buttons, switches, checkboxes read these, not primary-color.
      # Internal HA tokens: check on every HA release. Ignored by older frontends.
      ha-color-primary-05: "#1d0614"
      ha-color-primary-10: "#310e24"
      ha-color-primary-20: "#4a1837"
      ha-color-primary-30: "#723459"
      ha-color-primary-40: "#915076"
      ha-color-primary-50: "#a46188"
      ha-color-primary-60: "#c57fa6"
      ha-color-primary-70: "#de9bc0"
      ha-color-primary-80: "#edc3d9"
      ha-color-primary-90: "#f7e3ed"
      ha-color-primary-95: "#fcf2f7"

      # Neutral scale for newer frontends, tinted to match the surfaces
      ha-color-neutral-05: "#140e11"
      ha-color-neutral-10: "#221b1f"
      ha-color-neutral-20: "#362f33"
      ha-color-neutral-30: "#4a4246"
      ha-color-neutral-40: "#5c5559"
      ha-color-neutral-50: "#776f73"
      ha-color-neutral-60: "#978e93"
      ha-color-neutral-70: "#b2a9ae"
      ha-color-neutral-80: "#d1c7cc"
      ha-color-neutral-90: "#eee4e9"
      ha-color-neutral-95: "#fbf1f6"

      # Header, sidebar and dialogs
      app-header-background-color: "#faf0f5"
      app-header-text-color: "#191517"
      sidebar-background-color: "#faf0f5"
      sidebar-text-color: "#191517"
      sidebar-icon-color: "#686164"
