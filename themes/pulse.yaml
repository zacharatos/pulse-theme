      ha-color-primary-90: "#f7e3ed"
      ha-color-primary-95: "#fcf2f7"

      # Neutral scale for newer frontends, tinted to match the surfaces
      ha-color-neutral-05: "#170c12"
      ha-color-neutral-10: "#251920"
      ha-color-neutral-20: "#3a2d34"
      ha-color-neutral-30: "#4e4047"
