# Throwaway Home Assistant for testing the Pulse themes and cards. Never point this at the real house.
# Works on HA 2025.7 and newer (dashboard resources are added by setup.py, not here, because the
# YAML options for them changed between versions).
homeassistant:
  name: Test Home
  unit_system: metric
  time_zone: Europe/Athens
  country: GR
  latitude: 38.0
  longitude: 23.7
  elevation: 0
  currency: EUR
http:
  server_port: 8123
frontend:
  themes: !include_dir_merge_named themes
config:
# Invented lights, climate, media players, locks, covers, sensors, alarm panel and weather.
demo:
person:
sun:
logger:
  default: warning
