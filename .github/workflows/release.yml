name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/build-theme.mjs && git diff --exit-code themes/
      - run: node scripts/contrast.mjs
      - name: Tag matches package.json and has a CHANGELOG.md section
        run: node scripts/check-version.mjs "${GITHUB_REF_NAME}"
      - name: Release notes from CHANGELOG.md
        run: node scripts/changelog-notes.mjs "${GITHUB_REF_NAME#v}" > release-notes.md
      - uses: softprops/action-gh-release@v2
        with:
          files: themes/pulse.yaml
          body_path: release-notes.md
