name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/build-theme.mjs && git diff --exit-code themes/
      - run: node scripts/contrast.mjs
      - uses: softprops/action-gh-release@v2
        with:
          files: themes/pulse.yaml
          generate_release_notes: true
