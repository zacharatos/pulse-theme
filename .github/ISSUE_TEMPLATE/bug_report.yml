name: Something looks wrong
description: A colour, a contrast, a shape or a part of Home Assistant looks wrong with a Pulse theme.
labels: [bug]
body:
  - type: dropdown
    id: variation
    attributes:
      label: Which theme?
      multiple: true
      options:
        - Pulse
        - Pulse Glass
        - Pulse Tonal
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Light or dark?
      multiple: true
      options:
        - Light
        - Dark
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What do you see, and what did you expect?
      description: A screenshot helps a lot. Please hide anything private (names, addresses) first. Say where it is (a dashboard card, a more-info dialog, a settings page…) and which card it is, if it's a custom one.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Pulse Theme version
      description: In HACS.
    validations:
      required: true
  - type: input
    id: ha
    attributes:
      label: Home Assistant version
      placeholder: "2026.10.0"
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Browser or app, and device
      placeholder: "Chrome 141 on Windows / Companion app on an Android tablet"
